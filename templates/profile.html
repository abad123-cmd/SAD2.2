<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>User Profile</h2>
        <div>
            <strong>Full Name: </strong> {{ user[2] }}  <!-- Full Name -->
        </div>
        <div>
            <strong>Username: </strong> {{ user[1] }}  <!-- Username -->
        </div>
        <div>
            <strong>Email: </strong> {{ user[4] }}  <!-- Email -->
        </div>
        <div>
            <strong>Contact No: </strong> {{ user[5] }}  <!-- Contact No -->
        </div>
        <div>
            <strong>Age: </strong> {{ user[6] }}  <!-- Age -->
        </div>
        <div>
            <strong>Address: </strong> {{ user[7] }}  <!-- Address -->
        </div>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-3">Back to Dashboard</a>
    </div>
</body>
</html>
