<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .tracker-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #333;
            margin-bottom: 15px;
        }
        .placeholder {
            background-color: #e9ecef;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #6c757d;
            font-size: 18px;
            border-radius: 8px;
        }
        a.back-link {
            display: inline-block;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }
        a.back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<header>
    <h1>Customer Tracker</h1>
</header>

<div class="tracker-container">
    <h2>Live Tracking</h2>
    <div class="placeholder">
        <!-- Replace this div with map or tracking system later -->
        Tracking Map or Data Placeholder
    </div>
    <a href="/admin-dashboard" class="back-link">&larr; Back to Dashboard</a>
</div>

</body>
</html>
