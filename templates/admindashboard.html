<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: url("{{ url_for('static', filename='homedashboard.png') }}") no-repeat center center fixed;
            background-size: cover;
        }
        .dashboard-container {
            background: rgba(0, 0, 0, 0.8); /* darker transparent */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            max-width: 800px;
            margin: 100px auto; /* Center vertically */
            text-align: center;
        }
        h1 {
            color: white;
        }
        .dashboard-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        .dashboard-buttons a {
            display: inline-block;
            padding: 15px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .dashboard-buttons a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    {% block body %}
    <div class="dashboard-container">
        <h1>Welcome to the Admin Dashboard, {{ username }}!</h1>
        
        <div class="dashboard-buttons">
            <a href="/add-truck">Add a Truck</a>
            <a href="/Show-Client">Show Client</a>
            <a href="/tracker">Tracker</a>
            <!-- Updated link -->
            <a href="/staff-driver">Staff/Driver Management</a>
        </div>
    </div>
    {% endblock %}
</body>
</html>
